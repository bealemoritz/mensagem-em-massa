<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mensagens 1x1 · Le Moritz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&family=Figtree:wght@700&display=swap">
<style>
  :root { --ink:#1C1A15; --muted:#6B6455; --paper:#F1ECE1; --bg:#FAF7F0; --rule:#DED7C7; --time:#512B52; --representantes:#F9DF94; --embaixadoras:#84ABAA; --good:#5B7B5D; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', system-ui, sans-serif; margin: 0; padding: 0 20px 64px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { padding: 36px 0 20px; border-bottom: 1px solid var(--rule); margin-bottom: 24px; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  h1 { font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(26px,5vw,34px); margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .list { display: grid; gap: 12px; }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: 6px; padding: 18px 20px; }
  a.card:hover, a.card:focus-visible { border-color: var(--time); outline: none; }
  .card strong { font-family: 'Figtree', sans-serif; font-size: 18px; display: block; }
  .card span { font-size: 13.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Le Moritz · Comunidade</div>
    <h1>Mensagens 1x1</h1>
    <div class="sub">Uma ferramenta de disparo por frente. Cada página guarda as marcações de envio separadas.</div>
  </header>
  <div class="list">
    <a class="card" href="afiliadas/" style="--c: var(--time)"><strong>Afiliadas</strong><span>Letícia</span></a>
    <a class="card" href="embaixadoras/" style="--c: var(--embaixadoras)"><strong>Embaixadoras</strong><span>Thau</span></a>
    <a class="card" href="representantes/" style="--c: var(--representantes)"><strong>Representantes</strong><span>Vitória</span></a>
  </div>
</div>
</body>
</html>
